<section id="contact" class="contact-section">
  <div class="contact-container">

    <p class="section-label">
      <span class="pulse-dot" aria-hidden="true"></span>
      {{ 'CONTACT.LABEL' | translate }}
    </p>

    <h2>
      {{ 'CONTACT.TITLE' | translate }}
      <span>{{ 'CONTACT.SUBTITLE' | translate }}</span>
    </h2>

    <p class="contact-description">
      {{ 'CONTACT.DESCRIPTION' | translate }}
    </p>

    <!-- E-mail : l'élément principal -->
    <a class="email-link" [href]="'mailto:' + email">
      <span class="email-text">{{ email }}</span>
      <span class="email-arrow" aria-hidden="true">↗</span>
    </a>

    <!-- Téléphone + réseaux -->
    <ul class="contact-actions">
      <li>
        <a class="contact-chip" [href]="phoneHref">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8.1 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>
          </svg>
          {{ phone }}
        </a>
      </li>

      <li>
        <a class="contact-chip" [href]="linkedin" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6z"/>
            <rect x="2" y="9" width="4" height="12"/>
            <circle cx="4" cy="4" r="2"/>
          </svg>
          LinkedIn
          <span class="chip-arrow" aria-hidden="true">↗</span>
        </a>
      </li>

      <li>
        <a class="contact-chip" [href]="github" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/>
            <path d="M9 18c-4.51 2-5-2-7-2"/>
          </svg>
          GitHub
          <span class="chip-arrow" aria-hidden="true">↗</span>
        </a>
      </li>
    </ul>

  </div>

  <div class="contact-footer">
    <span>{{ 'CONTACT.THANKS' | translate }}</span>
    <span>© {{ year }} · Portfolio</span>
  </div>
</section>
